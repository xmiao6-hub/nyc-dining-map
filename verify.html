<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<script>
window.__errs = [];
window.onerror = function (msg, src, line) { window.__errs.push(msg + ' @' + line); return false; };
</script>
<script src="p5.min.js"></script></head>
<body><main class="panel">
<header id="page-header"><h1>T</h1></header>
<section class="controls">
  <div id="borough-chips" class="chips"></div>
  <div class="filters" id="license-filters">
    <button data-filter="ALL" class="active">All</button>
  </div>
</section>
<div id="canvas-wrap"><div id="tooltip" class="hidden"></div></div>
<footer><span class="source" id="source-note"></span></footer>
</main>
<pre id="report">pending</pre>
<script src="geo.js"></script>
<script src="data.js"></script>
<script src="sketch.js"></script>
<script>
setTimeout(function () {
  var out = { errs: window.__errs.slice() };
  try {
    var c = document.querySelector('#canvas-wrap canvas');
    var g = c.getContext('2d');
    var cssW = parseInt(getComputedStyle(c).width);
    var dpr = window.devicePixelRatio || 1;
    out.density = pixelDensity();
    out.densityLocked = c.width === Math.round(cssW * Math.min(2, dpr));
    out.layersAtDensity = bgLayer.elt.width === c.width && layer.elt.width === c.width;
    function stats() {
      var d = g.getImageData(0, 0, c.width, c.height).data;
      var colored = 0;
      for (var i = 0; i < d.length; i += 4) {
        var r = d[i], gg = d[i + 1], b = d[i + 2];
        if (0.3 * r + 0.6 * gg + 0.1 * b < 240 && Math.max(r, gg, b) - Math.min(r, gg, b) > 28) colored++;
      }
      return colored;
    }
    out.initialColored = stats();
    out.size0 = c.width + 'x' + c.height;
    document.getElementById('canvas-wrap').style.width = '1400px';
    windowResized();
    out.sizeWide = c.width + 'x' + c.height;
    out.wideColored = stats();
    document.getElementById('canvas-wrap').style.width = '';
    windowResized();
    out.sizeBack = c.width + 'x' + c.height;
    out.backColored = stats();
    var hdr = document.getElementById('page-header');
    out.straySprites = document.querySelectorAll('.spot-wrap, .edge').length;
    out.headerCanvases = hdr.querySelectorAll('canvas').length;
    out.bodyCanvases = document.querySelectorAll('body > canvas').length;
    out.chips = document.querySelectorAll('.chip').length;
  } catch (e) { out.error = String(e); }
  document.getElementById('report').textContent = 'REPORT ' + JSON.stringify(out);
}, 9000);
</script></body></html>
